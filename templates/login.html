<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VulnShop - Login</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f1115; color:#e6e6e6;
           display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    .card { background:#1a1d24; padding:2rem; border-radius:12px; width:320px; }
    h1 { font-size:1.3rem; margin:0 0 1rem; }
    input { width:100%; padding:.6rem; margin:.4rem 0; border-radius:6px;
            border:1px solid #333; background:#0f1115; color:#e6e6e6; box-sizing:border-box; }
    button { width:100%; padding:.6rem; margin-top:.6rem; border:0; border-radius:6px;
             background:#4f7cff; color:white; font-weight:600; cursor:pointer; }
    .err { color:#ff6b6b; font-size:.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>VulnShop</h1>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input name="username" placeholder="Username" autocomplete="off">
      <input name="password" type="password" placeholder="Password" autocomplete="off">
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
