name: Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # SAST: read the source code and look for vulnerable patterns
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Run Semgrep
        # --error makes the job FAIL if any finding is found.
        # That is what turns a scanner into a real security gate.
        run: semgrep scan --config p/python --config p/flask --config p/secrets --error .

  # DAST: start the running app and attack it from the outside
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed the database
        run: python init_db.py

      - name: Start the app in the background
        env: 
          SECRET_KEY:  ${{ secrets.SECRET_KEY}}
        run: |
          nohup python app.py > app.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -s http://localhost:5000/ >/dev/null; then
              echo "App is up"; break
            fi
            sleep 1
          done

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:5000"
          cmd_options: "-I"
          # don't try to open a GitHub issue (needs extra permissions)
          allow_issue_writing: false
  # SCA: check third-party dependencies for known vulnerabilities (CVEs)
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan dependencies
        # pip-audit exits with code 1 if any vulnerable package is found,
        # so the job fails and the pipeline goes red.
        run: pip-audit -r requirements.txt